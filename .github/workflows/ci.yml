name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        run: python -m compileall -q scholar_access

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python -m scholar_access --version
          python -m scholar_access --help

      - name: Build wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install --upgrade pip build
          python -m build
